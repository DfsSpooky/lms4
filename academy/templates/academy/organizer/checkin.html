{% extends 'academy/base.html' %}

{% block title %}Check-in: {{ event.title }}{% endblock %}

{% block content %}
<div class="min-h-screen bg-slate-900 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md mx-auto">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-black text-white">{{ event.title }}</h1>
            <p class="text-slate-400">Control de Acceso</p>
        </div>

        <!-- Scanner Card -->
        <div class="bg-slate-800 rounded-2xl p-4 shadow-xl border border-slate-700 mb-6">
            <div id="reader" class="rounded-xl overflow-hidden mb-4"></div>

            <div id="result-container" class="hidden p-4 rounded-xl text-center mb-4">
                <div id="result-icon" class="text-5xl mb-2"></div>
                <h2 id="result-title" class="text-xl font-bold text-white mb-1"></h2>
                <p id="result-message" class="text-sm text-slate-300"></p>
                <div id="result-user" class="mt-3 py-1 px-3 bg-white/10 rounded-full text-xs font-mono inline-block"></div>
            </div>

            <div class="relative">
                <input type="text" id="manual-ticket-id" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-4 py-3 text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none pl-10" placeholder="Ingresar ID Manualmente">
                <i class="fas fa-keyboard absolute left-3 top-3.5 text-slate-500"></i>
                <button onclick="checkIn(document.getElementById('manual-ticket-id').value)" class="absolute right-2 top-2 bg-indigo-600 hover:bg-indigo-500 text-white p-1.5 rounded-lg transition-colors">
                    <i class="fas fa-arrow-right"></i>
                </button>
            </div>
        </div>

        <div class="text-center">
            <a href="{% url 'academy:organizer_event_detail' event.id %}" class="text-slate-500 hover:text-white text-sm font-medium transition-colors">
                <i class="fas fa-arrow-left mr-2"></i> Volver al detalle
            </a>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<script>
    const resultContainer = document.getElementById('result-container');
    const resultIcon = document.getElementById('result-icon');
    const resultTitle = document.getElementById('result-title');
    const resultMessage = document.getElementById('result-message');
    const resultUser = document.getElementById('result-user');
    let isProcessing = false;

    function showResult(type, title, message, user='') {
        resultContainer.classList.remove('hidden', 'bg-emerald-500/20', 'bg-red-500/20', 'bg-yellow-500/20', 'border-emerald-500', 'border-red-500', 'border-yellow-500');
        resultContainer.classList.add('border');

        if (type === 'success') {
            resultContainer.classList.add('bg-emerald-500/20', 'border-emerald-500');
            resultIcon.innerHTML = '<i class="fas fa-check-circle text-emerald-500"></i>';
        } else if (type === 'error') {
            resultContainer.classList.add('bg-red-500/20', 'border-red-500');
            resultIcon.innerHTML = '<i class="fas fa-times-circle text-red-500"></i>';
        } else {
            resultContainer.classList.add('bg-yellow-500/20', 'border-yellow-500');
            resultIcon.innerHTML = '<i class="fas fa-exclamation-triangle text-yellow-500"></i>';
        }

        resultTitle.textContent = title;
        resultMessage.textContent = message;
        resultUser.textContent = user;
        resultContainer.classList.remove('hidden');

        // Auto hide after 3 seconds
        setTimeout(() => {
            resultContainer.classList.add('hidden');
            isProcessing = false;
        }, 4000);
    }

    async function checkIn(ticketId) {
        if (isProcessing || !ticketId) return;
        isProcessing = true;

        try {
            const response = await fetch('', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: `ticket_id=${ticketId}`
            });
            const data = await response.json();

            if (data.status === 'success') {
                showResult('success', 'Bienvenido', data.user, 'Ticket Válido');
                // Play success sound
                new Audio('https://assets.mixkit.co/active_storage/sfx/2578/2578-preview.m4a').play().catch(e=>{});
            } else if (data.status === 'warning') {
                showResult('warning', 'Ya Ingresó', data.message, data.user);
                new Audio('https://assets.mixkit.co/active_storage/sfx/950/950-preview.m4a').play().catch(e=>{});
            } else {
                showResult('error', 'Error', data.message);
                new Audio('https://assets.mixkit.co/active_storage/sfx/950/950-preview.m4a').play().catch(e=>{});
            }
        } catch (e) {
            showResult('error', 'Error de Red', 'No se pudo conectar al servidor.');
            isProcessing = false;
        }

        document.getElementById('manual-ticket-id').value = '';
    }

    function onScanSuccess(decodedText, decodedResult) {
        // Prevent multiple scans
        if (!isProcessing) {
            checkIn(decodedText);
        }
    }

    var html5QrcodeScanner = new Html5QrcodeScanner(
        "reader", { fps: 10, qrbox: 250 });
    html5QrcodeScanner.render(onScanSuccess);
</script>
{% endblock %}

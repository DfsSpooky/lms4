{% extends 'academy/base.html' %}

{% block title %}Nuevo Tema - LMS Academy{% endblock %}

{% block content %}
<div class="min-h-screen bg-slate-950 text-slate-300 py-12 flex items-center justify-center">
    <div class="max-w-2xl w-full px-4">

        <a href="{% url 'academy:forum_list' %}" class="inline-flex items-center gap-2 text-slate-500 hover:text-white mb-6 transition-colors">
            <i class="fas fa-arrow-left"></i> Volver al Foro
        </a>

        <div class="bg-slate-900 rounded-2xl p-8 border border-slate-800 shadow-2xl">
            <h1 class="text-2xl font-black text-white mb-6">Iniciar Nueva Discusión</h1>

            <form method="post" class="space-y-6">
                {% csrf_token %}

                <div>
                    <label class="block text-sm font-bold text-slate-300 mb-2">Título</label>
                    <input type="text" name="title" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition-all" placeholder="Ej: Duda sobre el ejercicio final...">
                </div>

                <div>
                    <label class="block text-sm font-bold text-slate-300 mb-2">Contenido</label>
                    <textarea name="content" required rows="6" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition-all" placeholder="Escribe aquí tu pregunta o comentario..."></textarea>
                </div>

                <div>
                    <label class="block text-sm font-bold text-slate-300 mb-2">Curso Relacionado (Opcional)</label>
                    <select name="course" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition-all">
                        <option value="">-- General --</option>
                        {% for course in form.fields.course.queryset %}
                            <option value="{{ course.id }}">{{ course.title }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="pt-4 flex justify-end">
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-8 rounded-xl shadow-lg shadow-indigo-500/20 transition-all transform hover:scale-105">
                        Publicar Tema
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

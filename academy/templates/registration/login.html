{% extends 'academy/base.html' %}
{% load static %}
{% load socialaccount %}

{% block title %}Iniciar Sesión - {{ site_config.site_name|default:"LMS Academy" }}{% endblock %}

{% block content %}
<div id="react-login-root" class="min-h-screen bg-[#0B1120]"></div>

<script id="django-context" type="application/json">
    {
        "csrfToken": "{{ csrf_token }}",
        "loginUrl": "{% url 'academy:login' %}",
        "signupUrl": "{% url 'academy:signup' %}",
        "resetUrl": "{% url 'password_reset' %}",
        "dashboardUrl": "{% url 'academy:dashboard' %}",
        "googleLoginUrl": "{% provider_login_url 'google' %}"
    }
</script>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
    const { useState, useEffect } = React;

    // --- COMPONENTE: INPUT CON ICONO ---
    const ModernInput = ({ label, type, name, value, onChange, disabled, icon }) => {
        const [isFocused, setIsFocused] = useState(false);

        return (
            <div className="mb-6 relative">
                <label className={`block text-xs font-bold uppercase tracking-wider mb-2 transition-colors ${isFocused ? 'text-indigo-400' : 'text-slate-500'}`}>
                    {label}
                </label>
                <div className={`relative flex items-center bg-slate-800/50 border rounded-xl transition-all duration-300 ${isFocused ? 'border-indigo-500 shadow-[0_0_15px_rgba(99,102,241,0.3)]' : 'border-slate-700'}`}>
                    <div className="pl-4 text-slate-400">
                        <i className={icon}></i>
                    </div>
                    <input
                        type={type}
                        name={name}
                        value={value}
                        onChange={onChange}
                        disabled={disabled}
                        onFocus={() => setIsFocused(true)}
                        onBlur={() => setIsFocused(false)}
                        className="w-full bg-transparent border-none text-white placeholder-slate-600 px-4 py-3 focus:ring-0 focus:outline-none text-sm font-medium"
                        placeholder={`Ingresa tu ${label.toLowerCase()}`}
                        required
                    />
                </div>
            </div>
        );
    };

    // --- PÁGINA DE LOGIN ---
    const LoginPage = () => {
        const ctx = JSON.parse(document.getElementById('django-context').textContent);
        
        const [formData, setFormData] = useState({ username: '', password: '' });
        const [error, setError] = useState(null);
        const [isLoading, setIsLoading] = useState(false);

        // Efecto de entrada suave
        const [mounted, setMounted] = useState(false);
        useEffect(() => setMounted(true), []);

        const handleChange = (e) => {
            setFormData({ ...formData, [e.target.name]: e.target.value });
            if (error) setError(null);
        };

        const handleSubmit = async (e) => {
            e.preventDefault();
            setIsLoading(true);
            setError(null);

            const data = new FormData();
            data.append('username', formData.username);
            data.append('password', formData.password);
            data.append('csrfmiddlewaretoken', ctx.csrfToken);

            try {
                const response = await fetch(ctx.loginUrl, {
                    method: 'POST',
                    body: data,
                    headers: { 'X-Requested-With': 'XMLHttpRequest' }
                });

                const contentType = response.headers.get("content-type");
                if (contentType && contentType.indexOf("application/json") !== -1) {
                    const json = await response.json();
                    if (json.success) {
                        window.location.href = json.redirect_url || ctx.dashboardUrl;
                    } else {
                        setError(json.errors?.non_field_errors?.[0] || "Credenciales incorrectas.");
                        setIsLoading(false);
                    }
                } else {
                    setIsLoading(false);
                    setError("Error del servidor. Por favor recarga.");
                }
            } catch (err) {
                console.error(err);
                setError("Error de conexión. Intenta nuevamente.");
                setIsLoading(false);
            }
        };

        return (
            <div className="min-h-screen relative flex items-center justify-center p-4 overflow-hidden font-sans selection:bg-indigo-500 selection:text-white">
                
                {/* FONDO ANIMADO (Igual que en Course List) */}
                <div className="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none">
                    <div className="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-indigo-600/10 rounded-full blur-[120px] animate-pulse"></div>
                    <div className="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-purple-600/10 rounded-full blur-[120px] animate-pulse"></div>
                </div>

                <div className={`w-full max-w-5xl grid grid-cols-1 lg:grid-cols-2 gap-0 lg:gap-8 items-center relative z-10 transition-all duration-1000 transform ${mounted ? 'translate-y-0 opacity-100' : 'translate-y-10 opacity-0'}`}>
                    
                    {/* COLUMNA IZQUIERDA: FORMULARIO */}
                    <div className="w-full max-w-md mx-auto">
                        <div className="bg-slate-900/60 backdrop-blur-xl border border-slate-700/50 p-8 sm:p-10 rounded-3xl shadow-2xl relative overflow-hidden group hover:border-slate-600/50 transition-colors">
                            
                            {/* Decoración superior */}
                            <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-indigo-500 via-purple-500 to-indigo-500"></div>

                            <div className="mb-8">
                                <div className="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-indigo-500/10 text-indigo-400 mb-6 border border-indigo-500/20 shadow-lg shadow-indigo-500/10">
                                    <i className="fas fa-fingerprint text-xl"></i>
                                </div>
                                <h1 className="text-3xl font-black text-white tracking-tight mb-2">Bienvenido</h1>
                                <p className="text-slate-400 text-sm">Ingresa tus credenciales para continuar tu aprendizaje.</p>
                            </div>

                            {error && (
                                <div className="mb-6 p-4 rounded-xl bg-red-500/10 border border-red-500/20 flex items-start gap-3 text-red-400 text-sm animate-bounce">
                                    <i className="fas fa-exclamation-circle mt-0.5 text-lg"></i>
                                    <span>{error}</span>
                                </div>
                            )}

                            <form onSubmit={handleSubmit}>
                                <ModernInput 
                                    label="Usuario" type="text" name="username" icon="fas fa-user"
                                    value={formData.username} onChange={handleChange} disabled={isLoading} 
                                />
                                
                                <div className="relative">
                                    <ModernInput 
                                        label="Contraseña" type="password" name="password" icon="fas fa-lock"
                                        value={formData.password} onChange={handleChange} disabled={isLoading} 
                                    />
                                    <a href={ctx.resetUrl} className="absolute right-0 top-0 text-[10px] sm:text-xs font-bold text-indigo-400 hover:text-indigo-300 transition-colors">
                                        ¿Olvidaste tu contraseña?
                                    </a>
                                </div>

                                <button 
                                    type="submit" 
                                    disabled={isLoading}
                                    className={`w-full py-4 rounded-xl font-bold text-white shadow-xl transition-all transform hover:-translate-y-1 flex items-center justify-center gap-3 mt-4
                                        ${isLoading ? 'bg-slate-700 cursor-wait' : 'bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 shadow-indigo-500/25'}
                                    `}
                                >
                                    {isLoading ? (
                                        <> <i className="fas fa-circle-notch fa-spin"></i> Verificando... </>
                                    ) : (
                                        <> Acceder a mi Cuenta <i className="fas fa-arrow-right"></i> </>
                                    )}
                                </button>
                            </form>

                            {/* SECCIÓN GOOGLE */}
                            <div className="mt-6 mb-2">
                                <a
                                    href={ctx.googleLoginUrl}
                                    className="w-full py-3 rounded-xl font-bold text-white bg-red-600 hover:bg-red-700 transition-all flex items-center justify-center gap-3 shadow-lg shadow-red-600/20"
                                >
                                    <i className="fab fa-google"></i>
                                    Iniciar sesión con Google
                                </a>
                            </div>

                            {/* SECCIÓN DE REGISTRO DESTACADA */}
                            <div className="mt-8 pt-6 border-t border-slate-700/50 text-center">
                                <p className="text-slate-400 text-sm mb-3">¿Eres nuevo en la plataforma?</p>
                                <a href={ctx.signupUrl} className="block w-full py-3 rounded-xl border border-slate-600 text-slate-300 font-bold text-sm hover:bg-slate-800 hover:text-white hover:border-slate-500 transition-all flex items-center justify-center gap-2 group">
                                    <i className="fas fa-user-plus text-indigo-400 group-hover:text-indigo-300"></i>
                                    Crear una cuenta gratis
                                </a>
                            </div>
                        </div>
                    </div>

                    {/* COLUMNA DERECHA: IMAGEN/BRANDING */}
                    <div className="hidden lg:flex flex-col justify-center items-start pl-12">
                        <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-indigo-300 text-xs font-bold uppercase tracking-widest mb-6">
                            <span className="w-2 h-2 rounded-full bg-indigo-400 animate-pulse"></span>
                            Comunidad Premium
                        </div>
                        <h2 className="text-5xl font-black text-white leading-[1.1] mb-6">
                            Tu futuro profesional <br/>
                            <span className="text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-cyan-400">empieza aquí.</span>
                        </h2>
                        <p className="text-lg text-slate-400 leading-relaxed max-w-md mb-10">
                            Únete a miles de estudiantes y profesionales que están llevando sus carreras al siguiente nivel con nuestra tecnología educativa.
                        </p>
                        
                        <div className="flex items-center gap-4">
                            <div className="flex -space-x-3">
                                {[1,2,3,4].map(i => (
                                    <img key={i} className="inline-block h-10 w-10 rounded-full ring-2 ring-[#0B1120] object-cover bg-slate-800" 
                                         src={`https://i.pravatar.cc/150?img=${i+10}`} alt="User" />
                                ))}
                            </div>
                            <div className="text-sm">
                                <p className="text-white font-bold">Más de 10k+</p>
                                <p className="text-slate-500">estudiantes activos</p>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('react-login-root'));
    root.render(<LoginPage />);
</script>
{% endblock %}

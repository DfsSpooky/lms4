{% extends 'academy/base.html' %}
{% load static %}

{% block title %}Crear Cuenta - {{ site_config.site_name|default:"LMS Academy" }}{% endblock %}

{% block content %}
<div id="react-signup-root" class="min-h-screen bg-[#0B1120]"></div>

<script id="django-context" type="application/json">
    {
        "csrfToken": "{{ csrf_token }}",
        "actionUrl": "{% url 'academy:signup' %}",
        "loginUrl": "{% url 'login' %}",
        "dashboardUrl": "{% url 'academy:dashboard' %}"
    }
</script>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

{% verbatim %}
<script type="text/babel">
    const { useState, useEffect } = React;

    // --- COMPONENTE: MODAL DE ÉXITO (DARK MODE) ---
    const SuccessModal = ({ isOpen, onClose, userName }) => {
        if (!isOpen) return null;
        return (
            <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm transition-opacity animate-fade-in">
                <div className="bg-slate-900 border border-slate-700 rounded-3xl shadow-2xl max-w-md w-full p-8 text-center transform transition-all scale-100 relative overflow-hidden">
                    {/* Efecto de luz de fondo */}
                    <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-emerald-500 to-green-500"></div>
                    
                    <div className="mx-auto mb-6 flex h-20 w-20 items-center justify-center rounded-full bg-emerald-500/10 border border-emerald-500/30 animate-bounce">
                        <i className="fas fa-check text-3xl text-emerald-400"></i>
                    </div>
                    
                    <h3 className="text-3xl font-black text-white mb-3 tracking-tight">¡Cuenta Creada!</h3>
                    <p className="text-slate-400 mb-8 text-lg">
                        Bienvenido a bordo, <strong className="text-white">{userName}</strong>. Tu viaje de aprendizaje comienza ahora.
                    </p>
                    
                    <button 
                        onClick={onClose} 
                        className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-4 rounded-xl transition-all shadow-lg shadow-emerald-500/20 text-lg flex items-center justify-center gap-2 transform hover:-translate-y-1"
                    >
                        <span>Ir a mi Dashboard</span>
                        <i className="fas fa-arrow-right"></i>
                    </button>
                </div>
            </div>
        );
    };

    // --- COMPONENTE: INPUT MODERNO (Soporta Select) ---
    const ModernInput = ({ label, type, name, value, onChange, error, required, options = [], icon }) => {
        const [isFocused, setIsFocused] = useState(false);
        const hasError = !!error;

        return (
            <div className="mb-5 relative group">
                <label className={`block text-xs font-bold uppercase tracking-wider mb-2 transition-colors ${hasError ? 'text-red-400' : (isFocused ? 'text-indigo-400' : 'text-slate-500')}`}>
                    {label} {required && <span className="text-red-500">*</span>}
                </label>
                
                <div className={`relative flex items-center bg-slate-800/50 border rounded-xl transition-all duration-300 ${
                    hasError 
                    ? 'border-red-500/50 bg-red-500/5' 
                    : (isFocused ? 'border-indigo-500 shadow-[0_0_15px_rgba(99,102,241,0.2)]' : 'border-slate-700 hover:border-slate-600')
                }`}>
                    <div className={`pl-4 ${hasError ? 'text-red-400' : 'text-slate-400'}`}>
                        <i className={icon}></i>
                    </div>

                    {type === 'select' ? (
                        <select
                            name={name}
                            value={value}
                            onChange={onChange}
                            disabled={false}
                            onFocus={() => setIsFocused(true)}
                            onBlur={() => setIsFocused(false)}
                            className="w-full bg-transparent border-none text-white px-4 py-3 focus:ring-0 focus:outline-none text-sm font-medium appearance-none cursor-pointer"
                        >
                            <option value="" disabled hidden className="bg-slate-900">Seleccionar...</option>
                            {options.map(opt => (
                                <option key={opt.value} value={opt.value} className="bg-slate-900 text-slate-200">
                                    {opt.label}
                                </option>
                            ))}
                        </select>
                    ) : (
                        <input
                            type={type}
                            name={name}
                            value={value}
                            onChange={onChange}
                            onFocus={() => setIsFocused(true)}
                            onBlur={() => setIsFocused(false)}
                            className="w-full bg-transparent border-none text-white placeholder-slate-600 px-4 py-3 focus:ring-0 focus:outline-none text-sm font-medium"
                            placeholder={type === 'date' ? '' : `Ingresa tu ${label.toLowerCase()}`}
                        />
                    )}
                    
                    {/* Icono de flecha para select */}
                    {type === 'select' && (
                        <div className="absolute right-4 text-slate-500 pointer-events-none">
                            <i className="fas fa-chevron-down text-xs"></i>
                        </div>
                    )}
                </div>
                
                {hasError && (
                    <p className="mt-1 text-xs text-red-400 flex items-center gap-1 font-medium animate-pulse">
                        <i className="fas fa-exclamation-circle"></i> {error}
                    </p>
                )}
            </div>
        );
    };

    // --- PÁGINA PRINCIPAL ---
    const SignupPage = () => {
        const ctx = JSON.parse(document.getElementById('django-context').textContent);
        
        const [formData, setFormData] = useState({
            username: '', first_name: '', last_name: '', email: '',
            dni: '', address: '', academic_profile: 'student',
            gender: 'male', phone_number: '',
            password1: '', password2: '' 
        });

        const [errors, setErrors] = useState({});
        const [isLoading, setIsLoading] = useState(false);
        const [showModal, setShowModal] = useState(false);
        const [mounted, setMounted] = useState(false);

        useEffect(() => setMounted(true), []);

        const handleChange = (e) => {
            const { name, value } = e.target;
            setFormData(prev => ({ ...prev, [name]: value }));
            if (errors[name]) setErrors(prev => ({ ...prev, [name]: null }));
        };

        const handleSubmit = async (e) => {
            e.preventDefault();
            setIsLoading(true);
            setErrors({});

            // Validación básica de contraseñas
            if (formData.password1 !== formData.password2) {
                setErrors({ password2: ["Las contraseñas no coinciden."] });
                setIsLoading(false);
                return;
            }

            const data = new FormData();
            Object.keys(formData).forEach(key => data.append(key, formData[key]));
            data.append('csrfmiddlewaretoken', ctx.csrfToken);

            try {
                const response = await fetch(ctx.actionUrl, {
                    method: 'POST',
                    body: data,
                    headers: { 'X-Requested-With': 'XMLHttpRequest' }
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    setShowModal(true);
                } else {
                    console.log("Errores:", result.errors);
                    setErrors(result.errors || {});
                }
            } catch (err) {
                console.error("Error de red:", err);
                setErrors({ non_field_errors: ["Error de conexión. Intenta nuevamente."] });
            } finally {
                setIsLoading(false);
            }
        };

        return (
            <div className="min-h-screen relative flex items-center justify-center p-4 overflow-x-hidden font-sans selection:bg-indigo-500 selection:text-white">
                
                <SuccessModal 
                    isOpen={showModal} 
                    onClose={() => window.location.href = ctx.dashboardUrl} 
                    userName={formData.first_name} 
                />

                {/* FONDO ANIMADO */}
                <div className="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none bg-[#0B1120]">
                    <div className="absolute top-[20%] right-[10%] w-[600px] h-[600px] bg-purple-600/10 rounded-full blur-[120px] animate-pulse"></div>
                    <div className="absolute bottom-[10%] left-[10%] w-[500px] h-[500px] bg-indigo-600/10 rounded-full blur-[120px] animate-pulse"></div>
                </div>

                <div className={`w-full max-w-6xl grid grid-cols-1 lg:grid-cols-2 gap-8 items-center relative z-10 transition-all duration-1000 transform ${mounted ? 'translate-y-0 opacity-100' : 'translate-y-10 opacity-0'}`}>
                    
                    {/* COLUMNA IZQUIERDA: VISUAL (Invertido en Desktop para variar) */}
                    <div className="hidden lg:flex flex-col justify-center items-start pr-12 order-2 lg:order-1">
                        <div className="relative w-full aspect-square max-w-lg mx-auto">
                            <div className="absolute inset-0 bg-gradient-to-tr from-indigo-500 to-purple-600 rounded-full opacity-20 blur-[80px] animate-pulse"></div>
                            <img 
                                src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80" 
                                className="relative rounded-3xl shadow-2xl border border-slate-700/50 object-cover w-full h-full transform rotate-3 hover:rotate-0 transition-transform duration-700"
                                alt="Estudiantes" 
                            />
                            
                            {/* Tarjeta flotante decorativa */}
                            <div className="absolute -bottom-6 -right-6 bg-slate-800/90 backdrop-blur border border-slate-600 p-4 rounded-2xl shadow-xl animate-bounce" style={{animationDuration: '3s'}}>
                                <div className="flex items-center gap-3">
                                    <div className="w-10 h-10 bg-emerald-500 rounded-full flex items-center justify-center text-white">
                                        <i className="fas fa-graduation-cap"></i>
                                    </div>
                                    <div>
                                        <p className="text-white font-bold text-sm">Certifícate</p>
                                        <p className="text-slate-400 text-xs">Validez internacional</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div className="mt-12">
                            <h2 className="text-4xl font-black text-white leading-tight mb-4">
                                Únete a la revolución <br/>
                                <span className="text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-purple-400">educativa.</span>
                            </h2>
                            <p className="text-slate-400 text-lg">Crea tu cuenta hoy y accede a cursos de tecnología de vanguardia.</p>
                        </div>
                    </div>

                    {/* COLUMNA DERECHA: FORMULARIO */}
                    <div className="w-full order-1 lg:order-2">
                        <div className="bg-slate-900/60 backdrop-blur-xl border border-slate-700/50 p-8 sm:p-10 rounded-3xl shadow-2xl relative">
                            
                            <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-indigo-500 via-purple-500 to-indigo-500 rounded-t-3xl"></div>

                            <div className="mb-8">
                                <h1 className="text-3xl font-black text-white tracking-tight mb-2">Crear Cuenta</h1>
                                <p className="text-slate-400 text-sm">Rellena el formulario para empezar.</p>
                            </div>

                            {errors.non_field_errors && (
                                <div className="mb-6 bg-red-500/10 border border-red-500/20 text-red-400 p-4 rounded-xl text-sm flex items-center gap-3 animate-shake">
                                    <i className="fas fa-bug text-lg"></i>
                                    <div>{errors.non_field_errors[0]}</div>
                                </div>
                            )}

                            <form onSubmit={handleSubmit}>
                                
                                {/* Sección: Datos de Cuenta */}
                                <div className="mb-6">
                                    <h3 className="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-4 border-b border-slate-800 pb-2">Credenciales</h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <ModernInput 
                                            label="Usuario" type="text" name="username" icon="fas fa-user"
                                            value={formData.username} onChange={handleChange} required={true}
                                            error={errors.username?.[0]} 
                                        />
                                        <ModernInput 
                                            label="Email" type="email" name="email" icon="fas fa-envelope"
                                            value={formData.email} onChange={handleChange} required={true}
                                            error={errors.email?.[0]} 
                                        />
                                    </div>
                                </div>

                                {/* Sección: Información Personal */}
                                <div className="mb-6">
                                    <h3 className="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-4 border-b border-slate-800 pb-2">Datos Personales</h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <ModernInput label="Nombres" type="text" name="first_name" icon="far fa-id-card" value={formData.first_name} onChange={handleChange} required={true} error={errors.first_name?.[0]} />
                                        <ModernInput label="Apellidos" type="text" name="last_name" icon="far fa-id-card" value={formData.last_name} onChange={handleChange} required={true} error={errors.last_name?.[0]} />
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <ModernInput label="DNI" type="text" name="dni" icon="fas fa-fingerprint" value={formData.dni} onChange={handleChange} required={true} error={errors.dni?.[0]} />
                                        <ModernInput 
                                            label="Perfil" type="select" name="academic_profile" icon="fas fa-user-graduate"
                                            value={formData.academic_profile} onChange={handleChange} required={true} 
                                            options={[
                                                {value: 'student', label: 'Estudiante'},
                                                {value: 'graduate', label: 'Egresado'},
                                                {value: 'professional', label: 'Profesional'}
                                            ]}
                                            error={errors.academic_profile?.[0]} 
                                        />
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <ModernInput
                                            label="Género" type="select" name="gender" icon="fas fa-venus-mars"
                                            value={formData.gender} onChange={handleChange} required={true}
                                            options={[
                                                {value: 'male', label: 'Masculino'},
                                                {value: 'female', label: 'Femenino'}
                                            ]}
                                            error={errors.gender?.[0]}
                                        />
                                        <ModernInput label="Celular" type="tel" name="phone_number" icon="fas fa-phone" value={formData.phone_number} onChange={handleChange} required={true} error={errors.phone_number?.[0]} />
                                    </div>
                                    <ModernInput label="Dirección" type="text" name="address" icon="fas fa-map-marker-alt" value={formData.address} onChange={handleChange} required={true} error={errors.address?.[0]} />
                                </div>

                                {/* Sección: Seguridad */}
                                <div className="mb-8">
                                    <h3 className="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-4 border-b border-slate-800 pb-2">Seguridad</h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <ModernInput label="Contraseña" type="password" name="password1" icon="fas fa-lock" value={formData.password1} onChange={handleChange} required={true} error={errors.password1?.[0]} />
                                        <ModernInput label="Confirmar" type="password" name="password2" icon="fas fa-check-double" value={formData.password2} onChange={handleChange} required={true} error={errors.password2?.[0]} />
                                    </div>
                                </div>

                                <button 
                                    type="submit" 
                                    disabled={isLoading}
                                    className={`w-full py-4 rounded-xl font-bold text-white shadow-xl transition-all transform hover:-translate-y-1 flex items-center justify-center gap-3
                                        ${isLoading ? 'bg-slate-700 cursor-wait' : 'bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 shadow-indigo-500/25'}
                                    `}
                                >
                                    {isLoading ? (
                                        <> <i className="fas fa-circle-notch fa-spin"></i> Creando cuenta... </>
                                    ) : (
                                        <> Registrarme Gratis <i className="fas fa-rocket"></i> </>
                                    )}
                                </button>
                            </form>

                            <div className="mt-6 text-center">
                                <p className="text-slate-400 text-sm">
                                    ¿Ya tienes una cuenta?{' '}
                                    <a href={ctx.loginUrl} className="font-bold text-indigo-400 hover:text-indigo-300 transition-colors">
                                        Inicia sesión aquí
                                    </a>
                                </p>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('react-signup-root'));
    root.render(<SignupPage />);
</script>
{% endverbatim %}
{% endblock %}

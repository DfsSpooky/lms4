{% extends 'academy/base.html' %}

{% block title %}Contraseña Restablecida - LMS Academy{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white shadow sm:rounded-lg p-8 text-center mt-12">
    <svg class="mx-auto h-12 w-12 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
    </svg>
    <h2 class="mt-4 text-2xl font-bold text-gray-900">¡Contraseña Restablecida!</h2>
    <p class="mt-2 text-gray-600">
        Tu contraseña ha sido cambiada exitosamente. Ya puedes iniciar sesión con tu nueva contraseña.
    </p>
    <div class="mt-6">
        <a href="{% url 'login' %}"
            class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-primary hover:bg-indigo-700">
            Iniciar Sesión
        </a>
    </div>
</div>
{% endblock %}
